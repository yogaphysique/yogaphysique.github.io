<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes</title>

  <link rel="stylesheet" href="../styles.css">

  <style>

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#fff;
    }

    .back-button{
      position:fixed;
      top:20px;
      left:20px;
      z-index:1000;

      display:inline-flex;
      align-items:center;
      gap:14px;

      padding:18px 28px;

      text-decoration:none;
      color:#8d93a1;

      background:transparent;
      border:1px solid #bfc3cb;
      border-radius:2px;

      font-size:18px;
      font-weight:500;
      font-family:Arial,sans-serif;

      transition:0.2s ease;
    }

    .back-button:hover{
      background:#f5f5f5;
      color:#555;
    }

    .back-arrow{
      font-size:28px;
      line-height:1;
      font-weight:400;
    }

    .content{
      max-width:1000px;
      margin:120px auto;
      padding:20px;
    }

  </style>

</head>

<body>

  <a href="../index.html" class="back-button">
    <span class="back-arrow">←</span>
    <span>Back to Home</span>
  </a>

  <div class="content">

    <h1>Classes</h1>

  </div>

</body>
</html>
