<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: #111;
    }

    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;

      display: inline-flex;
      align-items: center;
      gap: 12px;

      padding: 12px 18px;

      border: 1px solid #cfd3dc;
      border-radius: 4px;

      background: white;

      color: #7d8597;
      text-decoration: none;

      font-family: "Inter", sans-serif;
      font-size: 18px;
      font-weight: 500;

      transition: .2s;
    }

    .back-button:hover {
      background: #f7f7f7;
      color: #111;
      border-color: #999;
    }

    .arrow {
      font-size: 26px;
      line-height: 1;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 120px 20px 80px;
      text-align: center;
    }

    h1 {
      font-size: 64px;
      margin-bottom: 55px;
    }

    .poster {
      width: 100%;
      max-width: 650px;
      border-radius: 6px;
      box-shadow: 0 12px 30px rgba(0,0,0,.15);
    }

    .contact-section {
      margin-top: 55px;
    }

    .contact-button {
      display: inline-block;

      background: black;
      color: white;

      text-decoration: none;

      padding: 16px 36px;
      border-radius: 6px;

      font-weight: bold;
      font-size: 18px;

      transition: .2s;
    }

    .contact-button:hover {
      background: #333;
    }

    .contact-text {
      margin-top: 18px;
      color: #666;
      font-size: 16px;
      line-height: 1.6;
    }

    @media (max-width:768px){

      h1{
        font-size:46px;
      }

      .back-button{
        padding:10px 15px;
        font-size:16px;
      }

      .arrow{
        font-size:22px;
      }
    }

  </style>

</head>

<body>

<a class="back-button" href="../">
  <span class="arrow">←</span>
  <span>Back to Home</span>
</a>

<div class="container">

  <h1>Classes</h1>

  <img src="Yoga-Posterv2.jpg" alt="Wednesday Morning Yoga Poster" class="poster">

  <div class="contact-section">

    <a class="contact-button"
       href="sms:+16477019924?&body=Hi%20Anthony,%20I%20saw%20your%20Wednesday%20Morning%20Yoga%20poster%20and%20I'm%20interested%20in%20the%20class.">
      Text Me
    </a>

    <div class="contact-text">
      Questions about the class?<br>
      Tap the button above to send me a text message.
    </div>

  </div>

</div>

</body>
</html>
