<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes</title>

  <link rel="stylesheet" href="../styles.css">

  <style>

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#fff;
    }

    .back-button{
      position:fixed;
      top:20px;
      left:20px;
      z-index:1000;

      display:inline-flex;
      align-items:center;
      gap:10px;

      padding:13px 20px;

      text-decoration:none;
      color:#8d93a1;

      background:rgba(255,255,255,.95);
      border:1px solid #bfc3cb;
      border-radius:2px;

      font-size:16px;
      font-weight:500;

      transition:.2s ease;
    }

    .back-button:hover{
      background:#f5f5f5;
      color:#555;
    }

    .back-arrow{
      font-size:23px;
      line-height:1;
    }

    .content{
      width:min(90%,700px);
      margin:0 auto;
      padding:120px 0 80px;
      text-align:center;
    }

    .page-title{
      margin:0 0 35px;
      font-size:42px;
    }

    .poster{
      width:min(100%,520px);
      margin:0 auto;
    }

    .poster img{
      width:100%;
      height:auto;
      display:block;

      border-radius:8px;
      box-shadow:0 10px 30px rgba(0,0,0,.18);
    }

    @media (max-width:600px){

      .back-button{
        top:14px;
        left:14px;
        padding:11px 16px;
        font-size:14px;
      }

      .back-arrow{
        font-size:20px;
      }

      .content{
        padding-top:100px;
      }

      .page-title{
        font-size:34px;
      }

    }

  </style>

</head>

<body>

<a href="../index.html" class="back-button">
    <span class="back-arrow">←</span>
    <span>Back to Home</span>
</a>

<main class="content">

    <h1 class="page-title">Classes</h1>

    <div class="poster">
        <img src="poster.jpg" alt="Wednesday Morning Yoga Poster">
    </div>

</main>

</body>
</html>
